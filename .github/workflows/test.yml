name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run typecheck
        run: npm run typecheck
      - name: Run lint
        run: npm run check
      - name: Run tests
        run: npm run test
